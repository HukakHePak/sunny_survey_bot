services:
  tglibot:
    build: .
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
    command: npm run dev
    volumes:
      - ./:/app:delegated
      - /app/node_modules
      - ./data:/data
    ports: []
    networks:
      - tglinet

networks:
  tglinet:
    driver: bridge

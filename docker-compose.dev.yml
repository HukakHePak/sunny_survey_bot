services:
  tglibot:
    build: .
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
    command: npm run dev
    volumes:
      - ./:/app:delegated
      - /app/node_modules
      - ./data:/data
    ports: []
    networks:
      - tglinet

  pruner:
    image: node:20-slim
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./:/app:ro
      - ./data:/data
    command: sh -c "while true; do node scripts/prune_videos.js || true; sleep ${PRUNE_INTERVAL_SECONDS:-86400}; done"
    restart: unless-stopped

networks:
  tglinet:
    driver: bridge
